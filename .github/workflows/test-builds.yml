name: Test builds
# Builds the installers exactly like a release (desktop for Linux and Windows, the signed APK) but publishes nothing:
# the files are kept as run artifacts for a few days, to try on real devices before a version is released. They are
# numbered 0.0.99 so the first real release installs over them, on Android (higher versionCode) and on the desktop (the
# updater sees a newer version).
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  TEST_VERSION: 0.0.99
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @somnium/web exec vite build
        env: { SOMNIUM_VERSION: "${{ env.TEST_VERSION }}" }
      - uses: actions/upload-artifact@v4
        with: { name: web, path: apps/web/dist, if-no-files-found: error, retention-days: 1 }
  desktop:
    needs: web
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: --linux, files: "release/*.AppImage release/*.deb release/*.rpm" }
          - { os: windows-latest, target: --win, files: "release/*.exe" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: web, path: apps/web/dist }
      - name: Tools for the rpm package
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build the installers
        working-directory: apps/desktop
        shell: bash
        run: |
          npm pkg set version=$TEST_VERSION
          node build.mjs
          npx electron-builder ${{ matrix.target }} --publish never
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp ${{ matrix.files }} "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with: { name: "test-desktop-${{ runner.os }}", path: out/*, if-no-files-found: error, retention-days: 7 }
  android:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: web, path: apps/web/dist }
      - name: Copy the app into the Android project
        working-directory: apps/android
        run: node prepare-web.mjs && npx cap sync android
      # signed with the release key, so the real 0.1.0 installs over this test copy without losing its data
      - name: Build the signed APK
        working-directory: apps/android/android
        env:
          SOMNIUM_KEYSTORE_B64: ${{ secrets.SOMNIUM_KEYSTORE_B64 }}
          SOMNIUM_KEYSTORE_PASSWORD: ${{ secrets.SOMNIUM_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$SOMNIUM_KEYSTORE_B64" ] || { echo "::error::The Android signing key is missing"; exit 1; }
          printf '%s' "$SOMNIUM_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/somnium.jks"
          export SOMNIUM_KEYSTORE="$RUNNER_TEMP/somnium.jks"
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion=$TEST_VERSION
          rm -f "$SOMNIUM_KEYSTORE"
          APK=app/build/outputs/apk/release/app-release.apk
          "$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -n1)/apksigner" verify "$APK"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$APK" "$GITHUB_WORKSPACE/out/somnium-$TEST_VERSION-test.apk"
      - uses: actions/upload-artifact@v4
        with: { name: test-android, path: out/*, if-no-files-found: error, retention-days: 7 }
