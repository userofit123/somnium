# Checks every push and pull request: types in every package, all tests (including the data-isolation tests), the web
# build and the Android compile.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # every package, the web app (vue-tsc) and the desktop app included
      - run: pnpm -r typecheck
      # the engine tests run two files at a time (maxForks 2 in its vitest config) so a shared runner keeps enough memory
      - run: pnpm -r test
      - run: pnpm --filter @somnium/web exec vite build
  # Compiles the Android app (Java plugin included) without signing or publishing, so a broken build shows up before a release.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @somnium/web exec vite build
      - name: Copy the app into the Android project
        working-directory: apps/android
        run: node prepare-web.mjs && npx cap sync android
      - name: Compile the debug build
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
