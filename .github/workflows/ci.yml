# Checks every push and pull request: types, engine tests (including the data-isolation tests) and the web build.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @somnium/engine test
      - run: pnpm --filter @somnium/web exec vue-tsc --noEmit
      - run: pnpm --filter @somnium/web exec vite build
  # Compiles the Android app (Java plugin included) without signing or publishing, so a broken build shows up before a release.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @somnium/web exec vite build
      - name: Copy the app into the Android project
        working-directory: apps/android
        run: node prepare-web.mjs && npx cap sync android
      - name: Compile the debug build
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
