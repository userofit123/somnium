<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141233" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Somnium" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-maskable-192.png" />
    <title>Somnium</title>
    <!-- Before the first paint: the saved look (so there is no flash) and the phone/desktop layout. -->
    <script>try{var T=JSON.parse(localStorage.getItem("somniumTheme")||"{}"),h=document.documentElement;["bg","tex","rad","den","spc","nsp","fnt","nav"].forEach(function(k){if(T[k])h.dataset[k]=T[k]});var b=JSON.parse(localStorage.getItem("somniumBoot")||"null");h.style.background=b?b.bg:"#141233";h.style.colorScheme=!b||b.d?"dark":"light";if(b){h.style.setProperty("--sp1",b.a1);h.style.setProperty("--sp2",b.a2)}}catch(e){}
    (function(){var L=localStorage.getItem("somniumLayout")||"auto",w=Math.min(innerWidth,document.documentElement.clientWidth||innerWidth),t=matchMedia("(pointer:coarse)").matches;document.documentElement.classList.toggle("phone",L=="phone"||(L=="auto"&&(w<=860||(t&&w<=1100))))})();</script>
    <style>#splash{position:fixed;inset:0;display:grid;place-items:center}#splash i{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--sp1,#a99cff),var(--sp2,#6fd6ff));animation:spl 1.2s ease-in-out infinite}#splash svg{width:30px;height:30px}@keyframes spl{50%{transform:scale(.92);opacity:.7}}@media (prefers-reduced-motion:reduce){#splash i{animation:none}}</style>
  </head>
  <body>
    <div id="app"><div id="splash"><i><svg viewBox="0 0 24 24" fill="#1a1550" aria-hidden="true"><g transform="translate(.6 -.6)"><path fill-rule="evenodd" d="M11.27 5.25A7.31 7.31 0 1 0 17.99 14.9A5.91 5.91 0 0 1 11.27 5.25ZM5.6 14.6Q8.4 11.64 11.2 14.6Q8.4 17.56 5.6 14.6Z"/><circle cx="8.4" cy="14.6" r="1.2"/><path d="M17.44 7.03l.38 1.03 1.03.38-1.03.38-.38 1.03-.38-1.03-1.03-.38 1.03-.38z"/></g></svg></i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
